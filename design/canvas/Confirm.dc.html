<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Two-key confirmation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.app{--bg:#0e1513;--s1:#161d1b;--s3:#242c2a;--s4:#2f3735;--ol:#3f4946;--on:#dde4e1;--onv:#bec9c4;--p:#82d5c0;--onp:#00382d;--pc:#005143;--onpc:#9ef2db;--err:#ffb4ab;--errc:#93000a;--onerrc:#ffdad6;--e:cubic-bezier(.2,0,0,1);font-family:"Roboto Flex",system-ui,sans-serif;background:var(--bg);color:var(--on);width:1280px;height:800px;position:relative;overflow:hidden;font-size:14px;line-height:1.45}
.ms{font-family:"Material Symbols Rounded";font-size:24px;line-height:1;display:inline-block;font-variation-settings:"FILL" 1}
.behind{position:absolute;inset:0;padding:80px 120px;display:grid;grid-template-columns:5fr 7fr;gap:16px;opacity:.4}
.behind div{background:var(--s1);border-radius:28px}
.scrim{position:absolute;inset:0;background:#000b}
.dlg{position:absolute;left:50%;top:110px;width:560px;margin-left:-280px;background:var(--s3);border-radius:28px;padding:28px;display:flex;flex-direction:column;gap:18px;box-shadow:0 24px 64px #0009;animation:in .3s var(--e) both}
@keyframes in{from{opacity:0;transform:scale(.96)}}
.h{font-size:24px;line-height:32px;font-weight:500;margin:0;display:flex;gap:12px;align-items:center}
.muted{color:var(--onv);margin:0}
.aff{background:var(--s1);border-radius:16px;padding:14px 16px;font-size:13px}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.key{height:72px;border-radius:20px;border:2px solid var(--ol);background:none;color:var(--on);font:inherit;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;transition:all .3s var(--e)}
.key .ms{transition:transform .4s var(--e)}
.key.on{background:var(--errc);border-color:var(--errc);color:var(--onerrc)}
.key.on .ms{transform:rotate(90deg)}
.slide{height:56px;border-radius:28px;background:var(--s1);position:relative;overflow:hidden;transition:opacity .3s var(--e)}
.fill{position:absolute;left:0;top:0;bottom:0;background:var(--errc);border-radius:28px;transition:width .25s var(--e)}
.knob{position:absolute;top:4px;width:48px;height:48px;border-radius:24px;background:var(--onerrc);color:var(--errc);display:grid;place-items:center;transition:left .25s var(--e)}
.slide span.lbl{position:absolute;inset:0;display:grid;place-items:center;font-weight:600;color:var(--onv)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.btn{height:44px;border-radius:22px;border:0;font:inherit;font-weight:600;padding:0 20px;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.btn.text{background:none;color:var(--p)}
.btn.step{background:var(--s4);color:var(--on)}
.done{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);background:#dde4e1;color:#2b3230;border-radius:8px;padding:14px 16px;display:flex;gap:10px;align-items:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="app">
<div class="behind" aria-hidden="true"><div></div><div></div></div>
<div class="scrim" aria-hidden="true"></div>
<div class="dlg" role="alertdialog" aria-labelledby="ct" aria-describedby="cd">
<h2 id="ct" class="h"><span class="ms" style="color:var(--err)">stop_circle</span>Stop sharing?</h2>
<p id="cd" class="muted">Visitors lose access right away. The link cannot be reused.</p>
<div class="aff"><strong>Affects:</strong> the public link, the owned container and the tunnel. Volumes stay.</div>
<p class="muted" style="font-size:13px">Turn both keys, then slide to confirm.</p>
<div class="keys"><button class="{{k1cls}}" aria-pressed="{{k1}}" onClick="{{toggle1}}"><span class="ms">key</span>Key 1</button><button class="{{k2cls}}" aria-pressed="{{k2}}" onClick="{{toggle2}}"><span class="ms">key</span>Key 2</button></div>
<div class="slide" aria-label="Slide to confirm" style="opacity: {{slideOpacity}}"><span class="lbl">{{slideLabel}}</span><i class="fill" style="{{fillStyle}}"></i><span class="knob" style="{{knobStyle}}"><span class="ms">arrow_forward</span></span></div>
<div class="row"><button class="btn text"><span class="ms">logout</span>Emergency exit</button><button class="btn step" onClick="{{advance}}">Demo: slide 25%</button></div>
</div>
<sc-if value="{{finished}}" hint-placeholder-val="{{false}}"><div class="done" role="status"><span class="ms">check_circle</span>Sharing stopped.</div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const k1 = !!s.k1, k2 = !!s.k2, armed = k1 && k2;
const v = armed ? (s.v || 0) : 0;
return {
k1: String(k1), k2: String(k2), k1cls: k1 ? 'key on' : 'key', k2cls: k2 ? 'key on' : 'key',
toggle1: () => this.setState({ k1: !k1, v: 0 }), toggle2: () => this.setState({ k2: !k2, v: 0 }),
slideOpacity: armed ? 1 : 0.4, slideLabel: armed ? 'Slide to confirm' : 'Turn both keys first',
fillStyle: 'width:' + (v ? 'calc(' + v + '% )' : '0'), knobStyle: 'left:calc(4px + ' + v + '% - ' + (v * 0.56) + 'px)',
finished: v >= 100,
advance: () => { if (armed) this.setState({ v: Math.min(100, v + 25) }); }
};
}
}
</script>
</body>
</html>
