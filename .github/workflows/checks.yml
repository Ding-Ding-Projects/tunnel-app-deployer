name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check documentation syntax
        run: node --check docs/app.js
      - name: Check available application tests
        run: |
          if [ -d tests ]; then
            node --test
          else
            echo 'Application tests are pending implementation.'
          fi
  package-windows:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: tunnel-app-deployer-windows-${{ github.sha }}
          path: dist/*.exe
          if-no-files-found: error
