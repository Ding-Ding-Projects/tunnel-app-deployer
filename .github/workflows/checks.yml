name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check script syntax
        run: |
          for f in docs/app.js src/renderer/*.js src/*.js; do node --check "$f"; done
      - name: Check generated content is current
        run: node scripts/build-content.mjs --check
      - name: Run tests
        run: npm test
