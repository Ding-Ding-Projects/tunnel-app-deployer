name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check documentation syntax
        run: node --check docs/app.js
      - name: Check available application tests
        run: |
          if [ -d tests ]; then
            node --test
          else
            echo 'Application tests are pending implementation.'
          fi
