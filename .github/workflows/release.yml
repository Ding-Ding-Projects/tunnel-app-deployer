name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Record start time
        run: echo "STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Choose the next version
        id: version
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          # Read tags from the remote at this moment, not from the checkout, so a release published
          # by the previous run is always seen.
          last=$(git ls-remote --tags --refs origin "refs/tags/v${base}.*" | sed "s#.*refs/tags/v${base}\.##" | { grep -E '^[0-9]+$' || true; } | sort -n | tail -1)
          next="${base}.$(( ${last:--1} + 1 ))"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "Next version: $next"
      - name: Choose the dim sum code name
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/dim-sum-code-name.mjs > code-name.json
          cat code-name.json
      - name: Stamp version and build record
        run: |
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
          node scripts/write-build-info.mjs "${{ steps.version.outputs.version }}" "$GITHUB_SHA" code-name.json
      - name: Build the Squirrel.Windows installer
        run: npm run package:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Write release notes
        run: |
          v="${{ steps.version.outputs.version }}"
          elapsed=$(( $(date +%s) - STARTED_AT ))
          counts=$(node scripts/count-lines.mjs)
          {
            name=$(node -p "const c=require('./code-name.json'); c.ok ? c.en + ' · ' + c.zhHant : ''")
            if [ -n "$name" ]; then echo "Tunnel App Deployer $v, code name **$name**, built from commit $GITHUB_SHA."; else echo "Tunnel App Deployer $v, built from commit $GITHUB_SHA."; fi
            echo
            echo "## Download"
            echo
            echo "Run **Tunnel-App-Deployer-Setup-$v.exe** to install. Installed copies update themselves from this release feed (\`RELEASES\` and the full \`.nupkg\`). Delta packages are not generated yet."
            echo
            echo "These files are unsigned. Windows may show an unknown-publisher or SmartScreen warning. Package hashes are checked against \`RELEASES\`, which proves the download is intact, not who published it. Docker must be installed and running."
            echo
            echo "## Code name"
            echo
            node -e "const c=require('./code-name.json'); console.log(c.ok ? '- ' + c.en + ' · ' + c.zhHant + '\\n- Dish id: ' + c.id + '\\n- Photo: ' + c.photo + '\\n- Catalogue: ' + c.catalog : 'No code name for this release: ' + c.reason)"
            echo
            echo "## Checks"
            echo
            echo "This release workflow builds and publishes without running tests. The separate Application checks workflow runs the test suite on the same commit; see its result in the Actions tab."
            echo
            echo "## Build"
            echo
            echo "- Workflow time until packaging finished: $((elapsed / 60)) min $((elapsed % 60)) s"
            echo
            echo "Hand-written lines counted by scripts/count-lines.mjs:"
            echo
            echo "$counts" | sed 's/^/- /'
            echo
            echo "See the changelog in the app (Settings, About) or on the website."
          } > notes.md
          cat notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ steps.version.outputs.version }}"
          ls -la dist/squirrel-windows
          gh release create "v$v" dist/squirrel-windows/*.exe dist/squirrel-windows/RELEASES dist/squirrel-windows/*.nupkg --target "$GITHUB_SHA" --title "Tunnel App Deployer $v" --notes-file notes.md
